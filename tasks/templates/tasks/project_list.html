<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes Projets</title>
</head>
<body>
    <h1>Liste de mes projets</h1>

    <ul>
        {% for project in projects %}
            <li>
                <strong> {{ project.title }} </strong> 
                
                - {{ project.description }}
            </li>
        
        {% empty %}
            <li>Vous n'avez aucun projet pour le moment.</li>
        {% endfor %}
    </ul>

</body>
</html>
