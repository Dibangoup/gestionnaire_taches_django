{% extends 'tasks/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-secondary">Mes Projets</h2>
    </div>

    <div class="row">
        {% for project in projects %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body">
                        <h5 class="card-title text-primary fw-bold">{{ project.name }}</h5>
                        <p class="card-text text-muted">{{ project.description }}</p>
                        
                        <hr>
                        <a href="{% url 'project_detail' project.id %}" class="btn btn-outline-primary w-100">
                            Gérer les tâches
                        </a>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info shadow-sm" role="alert">
                    Vous n'avez aucun projet pour le moment. Allez dans l'interface d'administration pour en créer un !
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
